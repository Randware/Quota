services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./backend/config.toml:/app/config.toml:ro
      - backend-data:/data
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - QUOTA_DB_PATH=/data/database.db
    working_dir: /app
    command: ["dotnet", "Main.dll"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
        DISCORD_REDIRECT_URI: ${DISCORD_REDIRECT_URI}
        BACKEND_HOST: ${BACKEND_HOST}
    environment:
      - NODE_ENV=production
      - ORIGIN=${PUBLIC_ORIGIN:-http://localhost:8080}
    env_file:
      - ./.env
    depends_on:
      - backend

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - backend
      - frontend

volumes:
  backend-data:
